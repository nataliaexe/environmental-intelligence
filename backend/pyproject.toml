[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "environmental-intelligence-backend"
version = "0.1.0"
description = "Environmental intelligence backend"
requires-python = ">=3.10"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "httpx",
]


[tool.setuptools.packages.find]
include = ["app*"]
