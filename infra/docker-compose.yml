services:

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: environmental-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: environmental_intelligence
      POSTGRES_USER: environmental
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    ports:
      - "5433:5432"

    volumes:
      - environmental_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U environmental -d environmental_intelligence"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  environmental_postgres_data:
